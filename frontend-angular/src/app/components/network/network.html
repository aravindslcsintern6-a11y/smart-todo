<div class="container mt-4">
  <h3><b>Nmap Scanner</b></h3>

  <input
    type="text"
    class="form-control"
    [(ngModel)]="target"
    placeholder="Enter domain or IP"
    (keyup.enter)="scan()"
  />

  <button class="btn btn-primary mt-2" (click)="scan()">
    Scan
  </button>

  <hr>

  <h5><b>Scan Result:</b></h5>
  <pre>{{ result }}</pre>

  <hr>

  <h5><b>Scan History:</b></h5>
  <div *ngFor="let item of history" class="card mb-2 p-2">
    <strong>{{ item.target }}</strong>
    <br>
    <small>{{ item.scannedAt | date:'medium' }}</small>
  </div>
</div>
